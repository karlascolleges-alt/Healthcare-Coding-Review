name: SQL quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install SQLFluff
        run: python -m pip install sqlfluff==3.4.2

      - name: Parse Snowflake SQL
        run: python -m sqlfluff parse --dialect snowflake sql >/dev/null

      - name: Test expected outputs
        run: python -m unittest discover -s tests -v
