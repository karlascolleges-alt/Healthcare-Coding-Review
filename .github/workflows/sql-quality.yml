name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[app,dev]"

      - name: Run Python quality checks
        run: python -m ruff check .

      - name: Parse Snowflake SQL
        run: python -m sqlfluff parse --dialect snowflake sql >/dev/null

      - name: Run pipeline
        run: coding-review

      - name: Run tests with coverage
        run: python -m pytest
