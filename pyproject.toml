[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-coding-review"
version = "1.0.0"
description = "Explainable diagnosis reconciliation pipeline using synthetic healthcare data"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
app = ["fastapi>=0.115,<1", "pandas>=2.2,<3", "plotly>=5.24,<7", "streamlit>=1.40,<2", "uvicorn>=0.32,<1"]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1", "sqlfluff>=3.4,<4"]

[project.scripts]
coding-review = "coding_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=src/coding_review --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

